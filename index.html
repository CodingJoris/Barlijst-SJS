<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Barlijst">
<meta name="theme-color" content="#1E3B2E">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Barlijst</title>
<meta name="barlijst-versie" content="3.3">
<style>
:root{
  --ink:#1C2B24;--muted:#5E6B64;--paper:#F2F4F1;--card:#FFFFFF;--line:#D6DDD8;
  --forest:#1E3B2E;--forest-2:#2A4E3D;--green:#2F6B4F;--green-soft:#E3EFE7;--green-ink:#1F4A36;
  --amber:#9A6412;--amber-soft:#FBF0D9;--amber-line:#E7C77F;
  --red:#A8342B;--red-soft:#F8E3E0;--red-line:#E8A79F;
  --r:10px;--r-sm:7px;
  --font:"Avenir Next","Avenir","Helvetica Neue",-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;}
body{padding-bottom:env(safe-area-inset-bottom,0px);}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);}
.num{font-variant-numeric:tabular-nums;}
.hidden{display:none !important;}

/* Kopbalk */
.kop{position:sticky;top:0;z-index:50;background:var(--forest);border-bottom:1px solid var(--forest);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 0;}
.kop-rij{display:flex;align-items:center;gap:12px;max-width:1180px;margin:0 auto;}
.kop-naam{color:#fff;font-size:19px;font-weight:600;letter-spacing:-0.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.status{display:flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;border:1px solid transparent;background:transparent;}
.status.groen{background:var(--green-soft);color:var(--green-ink);border-color:#BCD7C6;}
.status.oranje{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line);}
.status.rood{background:var(--red-soft);color:var(--red);border-color:var(--red-line);}
.status.grijs{background:#ECEFED;color:var(--muted);border-color:var(--line);}
.status .stip{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0;}
.tabs{display:flex;gap:4px;max-width:1180px;margin:8px auto 0;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 14px 9px;font-size:16px;font-weight:600;color:var(--muted);white-space:nowrap;}
.tab{color:rgba(255,255,255,0.68);}
.tab.actief{color:#fff;border-bottom-color:#E9C46A;}

main{max-width:1180px;margin:0 auto;padding:16px 16px 24px;}
.sectie{display:none;}
.sectie.actief{display:block;}
h2{font-size:22px;font-weight:600;margin:4px 0 12px;letter-spacing:-0.01em;}
h3{font-size:17px;font-weight:600;margin:0 0 10px;}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 14px;}
.kaart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;}
.rij{display:flex;align-items:center;gap:10px;}
.rij-tussen{display:flex;align-items:center;justify-content:space-between;gap:10px;}

/* Knoppen */
.knop{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:11px 16px;font-weight:600;font-size:16px;}
.knop:active{transform:scale(0.98);}
.knop.primair{background:var(--green);border-color:var(--green);color:#fff;}
.knop.primair:disabled{background:#9DB8A9;border-color:#9DB8A9;}
.knop.gevaar{color:var(--red);border-color:var(--red-line);background:var(--red-soft);}
.knop.breed{width:100%;padding:15px;font-size:17px;}
.knop.klein{padding:7px 12px;font-size:14px;}
.terug{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;flex-shrink:0;}

/* Filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.pil{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted);}
.pil.actief{background:var(--ink);border-color:var(--ink);color:#fff;}
.zoek{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);}
.kopje{font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 8px;}

/* Ledentegels */
.leden{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
.lid{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:10px 12px;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:2px;}
.lid-naam{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lid-info{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:18px;}
.lid.aan{border-color:var(--green);background:var(--green-soft);}
.lid.gekozen{border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green);background:var(--green-soft);}
.lid .vink{position:absolute;top:8px;right:10px;color:var(--green);font-weight:700;}
.aanw-stip{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle;}
.neg{color:var(--red);}
.pos{color:var(--green);}
.streep{color:var(--green-ink);display:inline-flex;align-items:center;gap:4px;}

/* Categorietegels */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;}
.cat{position:relative;border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:104px;}
.cat.gekozen{border-color:var(--green);background:var(--green-soft);}
.cat.actief{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);}
.cat-ico{width:44px;height:44px;display:flex;align-items:center;justify-content:center;}
.cat-ico img{max-width:44px;max-height:44px;}
.ico-txt{width:40px;height:40px;border-radius:50%;background:var(--green-soft);color:var(--green-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;}
.cat-naam{font-size:14px;font-weight:600;text-align:center;line-height:1.2;}
.cat-prijs{font-size:13px;color:var(--muted);}
.badge{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;border-radius:13px;background:var(--green);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;}

/* POS: twee panelen naast elkaar op een liggende tablet */
.kassa{display:grid;grid-template-columns:minmax(300px,37%) minmax(0,1fr);gap:16px;height:calc(var(--app-h,100vh) - var(--kop-h,104px) - 40px);min-height:460px;}
.kassa-links{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 4px 12px 2px;}
.kassa-links h2{margin-top:0;}
.kassa-links .leden{grid-template-columns:repeat(2,minmax(0,1fr));}
.kassa-links .zoek{flex-basis:100%;}
.kassa-rechts{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.kassa-kop{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;min-height:58px;margin-bottom:10px;}
.kassa-naam{font-size:26px;font-weight:600;letter-spacing:-0.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kassa-naam.leeg{color:var(--muted);font-weight:500;font-size:20px;}
.kassa-saldo{text-align:right;font-size:13px;color:var(--muted);flex-shrink:0;}
.kassa-saldo strong{display:block;font-size:20px;}
.kassa-rechts .melding{margin-bottom:10px;}
.kassa-rechts .cats{gap:8px;}
.kassa-rechts .cat{display:grid;grid-template-columns:42px minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;align-items:center;align-content:center;text-align:left;min-height:70px;padding:8px 10px;}
.kassa-rechts .cat-ico{grid-row:1 / span 2;width:42px;height:42px;}
.kassa-rechts .cat-ico img{max-width:42px;max-height:42px;}
.kassa-rechts .cat-naam{text-align:left;align-self:end;}
.kassa-rechts .cat-prijs{align-self:start;}
.kassa-saldo .grens{display:block;color:var(--red);font-weight:600;}
.cats.uit .cat{opacity:0.45;}
.kassa-bon{flex:1;min-height:56px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:12px 0 10px;border-top:2px dashed var(--line);padding-top:4px;}
.kassa-bon .leeg{color:var(--muted);font-size:14px;padding:12px 0;}
.kassa-voet{display:flex;gap:8px;}
.kassa-voet .knop.primair{flex:1;padding:15px;font-size:17px;}
.knop.stil{background:#E7ECE9;border-color:#E7ECE9;color:var(--muted);}

/* Turflijst */
.turf-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r);background:var(--card);height:calc(var(--app-h,100vh) - var(--kop-h,104px) - 220px);min-height:320px;}
.turf{border-collapse:separate;border-spacing:0;min-width:100%;}
.turf th,.turf td{padding:3px;border-bottom:1px solid var(--line);background:var(--card);}
.turf thead th{position:sticky;top:0;z-index:2;background:#F7F9F7;font-size:12px;line-height:1.15;padding:6px 3px;font-weight:600;text-align:center;}
.turf thead th .prijs{display:block;font-weight:400;color:var(--muted);}
.turf .tnaam{position:sticky;left:0;z-index:1;text-align:left;min-width:132px;max-width:150px;padding:6px 8px 6px 12px;border-right:1px solid var(--line);}
.turf thead .tnaam{z-index:3;}
.turf .tnaam b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.turf .tnaam small{font-size:12px;}
.turf-vak{width:100%;min-width:56px;height:50px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);font-size:18px;font-weight:700;color:var(--green-ink);}
.turf-vak.heeft{background:var(--green-soft);border-color:#BCD7C6;}
.turf-vak:active{background:#CFE4D7;}
.turf tr.laatste td{background:#FBF4E2;}
.turf tr.laatste .turf-vak{border-color:var(--amber-line);}
.turf-balk{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);min-height:56px;}
.turf-balk .tekst{flex:1;font-weight:600;}
.turf-balk .tekst.stil{color:var(--muted);font-weight:500;}

/* Bonnetje / plakbalk onderin */
.plak{position:sticky;bottom:0;background:var(--paper);padding:12px 0 6px;margin-top:12px;}
.bon{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;margin-bottom:10px;}
.bon-regel{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);}
.bon-regel:last-child{border-bottom:none;}
.bon-naam{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.plusmin{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:600;}
.bon-aantal{min-width:24px;text-align:center;font-weight:700;}
.bon-bedrag{min-width:74px;text-align:right;}
.melding{border-radius:var(--r-sm);padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px;}
.melding.rood{background:var(--red-soft);color:var(--red);border:1px solid var(--red-line);}
.melding.oranje{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line);}
.melding.groen{background:var(--green-soft);color:var(--green-ink);border:1px solid #BCD7C6;}

/* Lijsten */
.regel{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.regel:last-child{border-bottom:none;}
.regel-hoofd{flex:1;min-width:0;}
.regel-titel{font-weight:600;}
.regel-sub{font-size:13px;color:var(--muted);}
.regel.doorgehaald .regel-titel,.regel.doorgehaald .regel-sub,.regel.doorgehaald .regel-bedrag{text-decoration:line-through;color:var(--muted);}
.label{display:inline-block;font-size:12px;font-weight:600;border-radius:5px;padding:1px 7px;margin-left:6px;vertical-align:1px;}
.label.corr{background:var(--red-soft);color:var(--red);}
.label.terug{background:#ECEFED;color:var(--muted);}
.label.papier{background:#EAE7F6;color:#3C3489;}
.sync-ico{width:22px;text-align:center;font-size:15px;flex-shrink:0;}
.sync-ico.wacht{color:var(--amber);}
.sync-ico.ok{color:var(--green);}
.sync-ico.fout{color:var(--red);}
.x-knop{width:36px;height:36px;border-radius:50%;border:1px solid var(--red-line);background:var(--red-soft);color:var(--red);font-weight:700;flex-shrink:0;}

/* Cijferblokken */
.cijfers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px;}
.cijfer{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;}
.cijfer-label{font-size:13px;color:var(--muted);}
.cijfer-waarde{font-size:24px;font-weight:600;}

/* Formulieren */
.veld{margin-bottom:12px;}
.veld label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.veld input,.veld select,.veld textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);}
.getalrij{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);}
.getalrij .naam{flex:1;font-weight:600;min-width:0;}
.getalrij input{width:84px;padding:9px;border:1px solid var(--line);border-radius:var(--r-sm);text-align:center;}
.verschil{min-width:44px;text-align:right;font-weight:700;}
.beheer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(20,30,25,0.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 30px) 16px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.paneel{background:var(--card);border-radius:14px;width:100%;max-width:640px;padding:18px;}
.paneel.breed{max-width:1040px;}
.pin-punten{font-size:32px;letter-spacing:12px;text-align:center;margin:8px 0 14px;font-variant-numeric:tabular-nums;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:0 auto;}
.pin-grid button{height:62px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);font-size:24px;font-weight:600;}
.pin-fout{color:var(--red);text-align:center;font-weight:600;min-height:22px;margin-top:8px;}

/* Papieren lijst */
.papier-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r-sm);max-height:62vh;overflow-y:auto;}
.papier{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%;}
.papier th,.papier td{border-bottom:1px solid var(--line);padding:4px;text-align:center;background:var(--card);}
.papier thead th{position:sticky;top:0;z-index:2;background:#F7F9F7;font-size:12px;line-height:1.2;padding:6px 4px;}
.papier .pnaam{position:sticky;left:0;z-index:1;text-align:left;font-weight:600;min-width:140px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px;}
.papier thead .pnaam{z-index:3;}
.papier input{width:46px;padding:7px 2px;border:1px solid var(--line);border-radius:6px;text-align:center;font-size:16px;}
.papier input.gevuld{background:var(--green-soft);border-color:var(--green);font-weight:700;}
.papier .ptot{min-width:70px;text-align:right;padding-right:10px;}

/* Toast en foutbalk */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%) translateY(140%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 20px;font-weight:600;font-size:15px;z-index:400;transition:transform .25s ease;max-width:92vw;text-align:center;}
.toast.zicht{transform:translateX(-50%) translateY(0);}
.toast.rood{background:var(--red);}
.toast.groen{background:var(--green);}
#foutbalk{position:fixed;left:0;right:0;bottom:0;background:var(--red);color:#fff;padding:10px 16px;font-size:14px;z-index:500;}

/* Afdrukken */
#printvlak{display:none;}
@media print{
  @page{size:A4 landscape;margin:10mm;}
  body.print > *:not(#printvlak){display:none !important;}
  body.print #printvlak{display:block;}
  #printvlak{font-family:var(--font);color:#000;}
  #printvlak h1{font-size:18px;margin:0 0 6px;}
  #printvlak .pkop{display:flex;gap:40px;font-size:13px;margin-bottom:8px;}
  #printvlak table{border-collapse:collapse;width:100%;font-size:11px;}
  #printvlak th,#printvlak td{border:1px solid #555;padding:3px 4px;height:22px;}
  #printvlak th{font-size:10px;}
  #printvlak td.pn{white-space:nowrap;font-weight:600;width:120px;}
  #printvlak tr.groep td{background:#e8e8e8;font-weight:700;height:auto;}
  #printvlak tr{page-break-inside:avoid;}
}
@media (max-width:700px){
  .cats{grid-template-columns:repeat(3,minmax(0,1fr));}
  .beheer-grid{grid-template-columns:1fr;}
  .cijfers{grid-template-columns:1fr 1fr;}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none;}}
</style>
</head>
<body>

<!-- Eerste start: koppelen aan de Google Sheet -->
<div id="setup" class="overlay hidden">
  <div class="paneel">
    <h2>Barlijst koppelen</h2>
    <p class="sub" style="margin-top:0;">Plak de web-app-URL van het Apps Script (Implementeren → Implementaties beheren). Dit hoeft maar één keer per iPad.</p>
    <div class="veld"><label for="setup-url">Web-app-URL</label><input id="setup-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off"></div>
    <div id="setup-fout" class="melding rood hidden"></div>
    <button class="knop primair breed" data-act="setup-verbind">Verbinden</button>
    <button class="knop breed hidden" id="setup-annuleer" data-act="setup-sluit" style="margin-top:8px;">Annuleren</button>
  </div>
</div>

<header class="kop">
  <div class="kop-rij">
    <div class="kop-naam" id="kop-naam">Barlijst</div>
    <button class="status grijs" id="status" data-act="open-wachtrij"><span class="stip"></span><span id="status-tekst">Laden</span></button>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab actief" data-act="tab" data-tab="aanmelden">Aanmelden</button>
    <button class="tab" data-act="tab" data-tab="bestellen">Bestellen</button>
    <button class="tab" data-act="tab" data-tab="ronde">Ronde</button>
    <button class="tab" data-act="tab" data-tab="turven">Turven</button>
    <button class="tab" data-act="tab" data-tab="historie">Historie</button>
    <button class="tab" data-act="tab" data-tab="overzicht">Overzicht</button>
    <button class="tab" data-act="tab" data-tab="beheer">Beheer</button>
  </nav>
</header>

<div id="naamwaarschuwing" class="hidden" style="max-width:1180px;margin:12px auto 0;padding:0 16px;"></div>
<main>
  <section id="s-aanmelden" class="sectie actief"></section>
  <section id="s-bestellen" class="sectie"></section>
  <section id="s-ronde" class="sectie"></section>
  <section id="s-turven" class="sectie"></section>
  <section id="s-historie" class="sectie"></section>
  <section id="s-overzicht" class="sectie"></section>
  <section id="s-beheer" class="sectie"></section>
</main>

<div id="overlay" class="overlay hidden"></div>
<div id="pin" class="overlay hidden">
  <div class="paneel" style="max-width:380px;">
    <h3 id="pin-titel" style="text-align:center;">Pincode</h3>
    <div id="pin-info" class="sub" style="text-align:center;margin:0 0 6px;"></div>
    <div class="pin-punten" id="pin-punten">····</div>

// SHA-256 over een UTF-8-tekst, uitkomst als hex. Werkt ook zonder https (geen crypto.subtle nodig).

  var b=unescape(encodeURIComponent(String(tekst))),n=b.length,i,j;

  for(i=0;i<n;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i&3)*8);
  w[n>>2]|=0x80<<(24-(n&3)*8);w[lengte-1]=n*8;
  var h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19],m=new Array(64);
  for(var blok=0;blok<lengte;blok+=16){

    }

      var S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K[i]+m[i])|0;
      var S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)),maj=(a&bb)^(a&c)^(bb&c),t2=(S0+maj)|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
    }

function hashPin(zout,pin,rondes){var h=sha256hex(zout+':'+pin);for(var i=1;i<rondes;i++)h=sha256hex(h+zout);return h;}

function willekeurig(n){
  var t='abcdefghijklmnopqrstuvwxyz0123456789',s='',a=new Uint8Array(n);
  try{crypto.getRandomValues(a);}catch(e){for(var i=0;i<n;i++)a[i]=Math.floor(Math.random()*256);}
  for(var j=0;j<n;j++)s+=t[a[j]%t.length];return s;
}
function nieuwId(){return apparaat+'-'+Date.now().toString(36)+'-'+willekeurig(5);}
function r2(x){return Math.round(x*100)/100;}
function leesBedrag(t){
  var v=String(t||'').replace(/[€\s]/g,'');
  if(v.indexOf(',')!==-1)v=v.replace(/\./g,'').replace(',','.');
  var n=parseFloat(v);return isNaN(n)?NaN:r2(n);
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function euro(v){var neg=v<-0.004;return(neg?'- ':'')+'€\u00a0'+Math.abs(v).toFixed(2).replace('.',',');}
function pad(n){return(n<10?'0':'')+n;}
function tijdKort(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());}
function datumKort(ms){var d=new Date(ms);return d.getDate()+'-'+(d.getMonth()+1);}
function tijdLabel(ms){
  var d=new Date(ms),nu=new Date();
  if(d.toDateString()===nu.toDateString())return tijdKort(ms);
  return datumKort(ms)+' '+tijdKort(ms);
}
function isoDatum(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function inst(sleutel,def){var v=cache&&cache.instellingen?cache.instellingen[sleutel]:undefined;return(v===undefined||v===''||v===null)?def:v;}
function instGetal(sleutel,def){var v=parseFloat(String(inst(sleutel,def)).replace(',','.'));return isNaN(v)?def:v;}
function toast(tekst,soort){
  var t=document.getElementById('toast');t.textContent=tekst;t.className='toast zicht'+(soort?' '+soort:'');
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.className='toast';},soort==='rood'?6000:2600);
}
function streepjes(n){
  // Turfstreepjes: het beeld van de papieren barlijst
  if(n<=0)return'';
  var groepen=Math.min(Math.floor(n/5),2),rest=n-groepen*5,extra=0;
  if(groepen===2&&rest>0){extra=rest;rest=0;}
  var svg='',x=0;
  for(var g=0;g<groepen;g++){
    for(var i=0;i<4;i++)svg+='<line x1="'+(x+2+i*4)+'" y1="2" x2="'+(x+2+i*4)+'" y2="14"/>';
    svg+='<line x1="'+x+'" y1="12" x2="'+(x+16)+'" y2="4"/>';x+=21;
  }
  for(var j=0;j<rest;j++){svg+='<line x1="'+(x+2+j*4)+'" y1="2" x2="'+(x+2+j*4)+'" y2="14"/>';}
  if(rest)x+=rest*4+3;
  var w=Math.max(x,4);
  return '<span class="streep"><svg width="'+w+'" height="16" viewBox="0 0 '+w+' 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">'+svg+'</svg>'+(extra?'<span>+'+extra+'</span>':'')+'</span>';
}
function catIcoon(cat){
  if(ICONEN[cat])return '<img src="'+ICONEN[cat]+'" alt="">';
  var t=cat.replace(/[^A-Za-zÀ-ÿ]/g,'').slice(0,2);
  return '<span class="ico-txt">'+esc(t.charAt(0).toUpperCase()+t.slice(1).toLowerCase())+'</span>';
}

function leden(){return cache&&cache.leden?cache.leden:[];}

// Alle regels op de iPad, met de status van hun bestelling erbij
function lokaleRegels(){
  if(_vlak)return _vlak;
  var a=[];
  Object.keys(orders).forEach(function(id){
    var o=orders[id];
    if(o.sheet!==url)return;
    o.regels.forEach(function(r){var c={};for(var k in r)c[k]=r[k];c.status=o.status;c.reden=o.reden;a.push(c);});
  });
  _vlak=a;return a;
}
// Staat deze bestelling volledig in de Sheet, volgens de laatst opgehaalde gegevens?
function sheetHeeft(orderId,n){

}
function serverHeeftRegel(r){var o=orders[r.bestelId];return o?sheetHeeft(o.id,o.n):true;}

function alleRegels(){return (cache&&cache.log?cache.log:[]).concat(lokaalExtra());}
function saldo(naam){
  var basis=0;leden().forEach(function(l){if(l.naam===naam)basis=l.saldo;});
  lokaalExtra().forEach(function(r){if(r.naam===naam)basis+=Number(r.bedrag)||0;});
  return r2(basis);
}
function voorraad(cat){
  var basis=0;(cache&&cache.voorraad?cache.voorraad:[]).forEach(function(v){if(v.categorie===cat)basis=v.voorraad;});
  lokaalExtra().forEach(function(r){
    if(r.categorie!==cat)return;var n=Number(r.aantal)||0;
    if(r.type==='consumptie')basis-=n;else if(r.type==='inkoop'||r.type==='telling')basis+=n;

}
function baravondStart(){

}
function avondTotalen(){

    if(r.type!=='consumptie'||r.tijd<start)return;
    if(!m[r.naam])m[r.naam]={items:0,bedrag:0};

function groepen(){

// ---------- Aanwezigheid ----------

// ---------- Opslaan op de iPad ----------
// Een bestelling (een of meer regels) wordt in een keer weggeschreven en teruggelezen.
function bewaarLokaal(nieuw){
  if(!nieuw||!nieuw.length)return false;
  var id=nieuw[0].bestelId||nieuwId(),nu=Date.now();
  nieuw.forEach(function(r,i){r.bestelId=id;r.id=id+'-'+(i+1);});
  var o={id:id,tijd:nu,aangemaakt:nu,status:'wacht',n:nieuw.length,regels:nieuw,sheet:url};
  if(orders[id]||!bewaarOrder(o)){
    if(!orders[id])lsWeg(K.order+id);
    toonMelding('NIET opgeslagen','De iPad kon de bestelling niet bewaren (opslag vol of geblokkeerd). Noteer deze bestelling op papier.');
    return false;
  }
  orders[id]=o;vlakWeg();
  teller.gemaakt++;lsSet(K.teller,teller);
  renderAlles();
  setTimeout(synchroniseer,300);
  return true;
}
function regel(v){
  return {id:'',bestelId:v.bestelId,tijd:v.tijd||Date.now(),naam:v.naam||'',type:v.type,categorie:v.categorie||'',
    aantal:v.aantal===undefined?null:v.aantal,stukprijs:v.stukprijs===undefined?null:v.stukprijs,bedrag:r2(v.bedrag||0),
    refId:v.refId||'',lijst:v.lijst||'',bron:v.bron||'tablet',opmerking:v.opmerking||'',aangemaakt:Date.now()};
}
function consumptieRegels(naam,bon,bestelId,extra){
  extra=extra||{};
  return Object.keys(bon).filter(function(c){return bon[c]>0;}).map(function(c){
    var p=prijsVan(c);
    return regel({bestelId:bestelId,tijd:extra.tijd,naam:naam,type:'consumptie',categorie:c,aantal:bon[c],stukprijs:p,bedrag:-bon[c]*p,lijst:extra.lijst,bron:extra.bron});
  });
}

// ---------- Synchronisatie ----------
function ordersMet(status){
  return Object.keys(orders).map(function(id){return orders[id];}).filter(function(o){return o.status===status&&o.sheet===url;})
    .sort(function(a,b){return a.aangemaakt-b.aangemaakt;});
}
function wachtend(){return ordersMet('wacht');}
function geweigerd(){return ordersMet('geweigerd');}
function metTijdslimiet(p,ms,ctl){
  var t;return Promise.race([p,new Promise(function(_,rej){t=setTimeout(function(){try{ctl&&ctl.abort();}catch(e){}rej(new Error('geen reactie van de server'));},ms);})]).then(function(v){clearTimeout(t);return v;},function(e){clearTimeout(t);throw e;});
}
function post(data){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  return metTijdslimiet(fetch(url,{method:'POST',body:JSON.stringify(data),signal:ctl?ctl.signal:undefined}).then(function(r){return r.text();}).then(function(t){try{return JSON.parse(t);}catch(e){throw new Error('onverwacht antwoord van de server');}}),45000,ctl);
}
function zetFout(t){laatsteFout=t;lsSet(K.fout,t);}

// Na elke keer ophalen: vergelijk wat de iPad als 'verstuurd' heeft met wat er
// werkelijk in de Sheet staat. Ontbreekt er iets, dan gaat het opnieuw de wachtrij in.
function zelfControle(gestartOp){
  var terug=0;
  Object.keys(orders).forEach(function(id){
    var o=orders[id];
    if(o.status!=='verstuurd'||!(o.verstuurdOp<gestartOp)||o.sheet!==url)return;
    if(sheetHeeft(o.id,o.n))return;
    // Na vijf vergeefse pogingen niet eindeloos doorgaan, maar zichtbaar melden
    o.pogingen=(o.pogingen||0)+1;delete o.verstuurdOp;
    if(o.pogingen>5){o.status='geweigerd';o.reden='De Sheet bevestigt deze bestelling niet volledig. Controleer het tabblad Log.';}
    else o.status='wacht';
    bewaarOrder(o);terug++;
  });
  if(terug){vlakWeg();teller.hersteld=(teller.hersteld||0)+terug;lsSet(K.teller,teller);}
  return terug;
}
// Verstuurde bestellingen ouder dan 14 dagen gaan van de iPad af, maar alleen
// als de Sheet ze volledig heeft.
function opruimen(){
  var nu=Date.now(),weg=0;
  Object.keys(orders).forEach(function(id){
    var o=orders[id];
    if(o.status==='verstuurd'&&(nu-(o.verstuurdOp||nu))>BEWAAR_VERSTUURD_MS&&sheetHeeft(o.id,o.n)){lsWeg(K.order+id);delete orders[id];weg++;}
  });
  if(weg)vlakWeg();
}
function haalGegevens(){
  if(!url)return Promise.resolve(false);
  var gestartOp=Date.now();
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  return metTijdslimiet(fetch(url+'?actie=getData&t='+Date.now(),{signal:ctl?ctl.signal:undefined}).then(function(r){return r.text();}).then(function(t){
    var d;try{d=JSON.parse(t);}catch(e){throw new Error('onverwacht antwoord van de server');}
    if(!d||!d.ok)throw new Error((d&&d.fout)||'serverfout');
    if(!Array.isArray(d.leden)||!Array.isArray(d.prijzen)||!d.orders)throw new Error('de Sheet draait nog een oude versie van het script');
    d.opgehaald=Date.now();cache=d;lsSet(K.cache,cache);laatsteContact=d.opgehaald;vlakWeg();
    zetFout('');
    var terug=zelfControle(gestartOp);
    opruimen();renderAlles();
    if(terug)setTimeout(synchroniseer,50);
    return true;
  }),45000,ctl).catch(function(e){zetFout(e.message);renderStatus();return false;});
}
function pakket(){
  var p=[],n=0,w=wachtend();
  for(var i=0;i<w.length;i++){
    if(p.length&&(p.length>=MAX_ORDERS_PER_KEER||n+w[i].regels.length>MAX_REGELS_PER_KEER))break;
    p.push(w[i]);n+=w[i].regels.length;
  }
  return p;
}
function schoneRegel(r){var c={};for(var k in r){if(k!=='aangemaakt'&&k!=='status'&&k!=='reden')c[k]=r[k];}return c;}
function synchroniseer(handmatig){
  if(!url||bezigMetSync)return Promise.resolve();
  if(handmatig===true){geweigerd().forEach(function(o){o.status='wacht';delete o.reden;bewaarOrder(o);});vlakWeg();}
  var p=pakket();
  if(!p.length)return handmatig===true?haalGegevens():Promise.resolve();
  bezigMetSync=true;renderStatus();
  var verstuur=p.map(function(o){return{id:o.id,regels:o.regels.map(schoneRegel)};});
  return post({actie:'sync',orders:verstuur}).then(function(res){
    if(!res||!res.ok)throw new Error((res&&res.fout)||'serverfout');
    var per={};(res.resultaat||[]).forEach(function(x){per[x.id]=x;});
    var nu=Date.now(),verwerkt=0;
    p.forEach(function(o){
      var x=per[o.id];
      if(!x)return; // geen bevestiging voor deze bestelling: blijft wachten
      // Alleen 'verstuurd' als de Sheet precies het aantal regels van de hele bestelling bevestigt
      if(x.status==='ok'&&Number(x.regels)===o.regels.length){
        o.status='verstuurd';o.verstuurdOp=nu;
        if(!o.geteld){o.geteld=true;teller.bevestigd++;}
      }else if(x.status==='geweigerd'){o.status='geweigerd';o.reden=x.reden||'onbekende reden';}
      else return;
      bewaarOrder(o);verwerkt++;
    });
    vlakWeg();lsSet(K.teller,teller);
    laatsteContact=nu;zetFout('');bezigMetSync=false;
    if(!verwerkt)throw new Error('de Sheet gaf geen bevestiging');
    if(wachtend().length)return synchroniseer();
    return haalGegevens();
  }).catch(function(e){bezigMetSync=false;zetFout(e.message);renderStatus();if(handmatig===true)toast('Versturen lukt nu niet: '+e.message,'rood');});
}
// Volledige controle op verzoek: vraag de Sheet per bestelling of hij compleet is
function volledigeControle(){
  var lijst=Object.keys(orders).map(function(id){return orders[id];}).filter(function(o){return o.status==='verstuurd'&&o.sheet===url;});
  if(!url)return Promise.resolve({ok:false,fout:'niet gekoppeld'});
  return post({actie:'controle',orders:lijst.map(function(o){return{id:o.id,n:o.n};})}).then(function(res){
    if(!res||!res.ok)throw new Error((res&&res.fout)||'serverfout');
    var fout={};(res.ontbreekt||[]).concat(res.onvolledig||[]).forEach(function(id){fout[id]=1;});
    var terug=0;
    lijst.forEach(function(o){if(fout[o.id]){o.status='wacht';delete o.verstuurdOp;bewaarOrder(o);terug++;}});
    if(terug){vlakWeg();teller.hersteld=(teller.hersteld||0)+terug;lsSet(K.teller,teller);}
    return {ok:true,gecontroleerd:lijst.length,terug:terug};
  }).catch(function(e){return {ok:false,fout:e.message};});
}

// ---------- Status ----------
function statusInfo(){
  var w=wachtend(),g=geweigerd();
  if(!url)return{kleur:'grijs',tekst:'Niet gekoppeld'};
  if(!cache)return{kleur:'grijs',tekst:bezigMetSync?'Verbinden':'Nog niet verbonden'};
  if(beschadigd.length)return{kleur:'rood',tekst:'Opslag beschadigd, zie Beheer'};
  if(g.length)return{kleur:'rood',tekst:g.length+' bestelling'+(g.length===1?'':'en')+' geweigerd'};
  if(!w.length)return{kleur:'groen',tekst:'Alles staat in de Sheet'};
  var oudste=Infinity;w.forEach(function(o){if(o.aangemaakt<oudste)oudste=o.aangemaakt;});
  var n=w.length,min=(Date.now()-oudste)/60000,grens=instGetal('Wachtrijwaarschuwing',30);
  if(min>grens)return{kleur:'rood',tekst:'Al '+Math.round(min)+' min niet verstuurd: '+n};
  return{kleur:'oranje',tekst:(bezigMetSync?'Versturen: ':'')+n+' bestelling'+(n===1?'':'en')+' alleen op iPad'};
}

  }

// ---------- Filters (groep + zoek) ----------
var filters={turven:{g:'',z:''},aanmelden:{g:'',z:''},bestellen:{g:'',z:''},ronde:{g:'',z:''},overzicht:{g:'',z:''},papier:{g:'',z:''}};
function filterBalk(ctx,metAanwezig){
  var f=filters[ctx],h='<div class="filters">';
  h+='<button class="pil'+(f.g===''?' actief':'')+'" data-act="groep" data-ctx="'+ctx+'" data-groep="">Iedereen</button>';
  if(metAanwezig)h+='<button class="pil'+(f.g==='__aanwezig'?' actief':'')+'" data-act="groep" data-ctx="'+ctx+'" data-groep="__aanwezig"><span class="aanw-stip"></span>Aanwezig</button>';
  groepen().forEach(function(g){h+='<button class="pil'+(f.g===g?' actief':'')+'" data-act="groep" data-ctx="'+ctx+'" data-groep="'+esc(g)+'">'+esc(g)+'</button>';});
  h+='<input class="zoek" type="search" placeholder="Zoek op naam" data-zoek="'+ctx+'" value="'+esc(f.z)+'"></div>';
  return h;
}
function gefilterd(ctx){
  var f=filters[ctx],z=f.z.toLowerCase();
  return leden().filter(function(l){
    if(f.g==='__aanwezig'&&!isAanwezig(l.naam))return false;
    if(f.g&&f.g!=='__aanwezig'&&l.groep!==f.g)return false;
    if(z&&l.naam.toLowerCase().indexOf(z)===-1)return false;
    return true;
  }).sort(function(a,b){return a.naam.localeCompare(b.naam,'nl');});
}
function aanwezigEerst(lijst,tegel){
  var a=lijst.filter(function(l){return isAanwezig(l.naam);}),r=lijst.filter(function(l){return !isAanwezig(l.naam);}),h='';
  if(a.length&&r.length)h+='<div class="kopje">Aanwezig</div>';
  if(a.length)h+='<div class="leden">'+a.map(function(l){return tegel(l,true);}).join('')+'</div>';
  if(a.length&&r.length)h+='<div class="kopje">Overige leden</div>';
  if(r.length)h+='<div class="leden">'+r.map(function(l){return tegel(l,false);}).join('')+'</div>';
  return h||leegTekst();
}
function leegTekst(){
  if(!leden().length)return '<div class="melding oranje">Er staan nog geen leden in de Sheet. Vul het tabblad Leden en tik daarna in Beheer op Gegevens verversen.</div>';

// Eén tik is direct één streepje. De laatste tik kan binnen enkele seconden
// ongedaan worden gemaakt; dat wordt een correctieregel, net als terugboeken.
var turfLaatste=null,turfTimer=null,turfStandaardGezet=false;
var TURF_ONGEDAAN_MS=8000;
function avondPerProduct(){
  var start=baravondStart().getTime(),m={};
  alleRegels().forEach(function(r){
    if(r.type!=='consumptie'||r.tijd<start)return;
    var k=r.naam+'|'+r.categorie;m[k]=(m[k]||0)+(Number(r.aantal)||0);
  });
  return m;
}
function renderTurven(){
  var el=document.getElementById('s-turven');

  if(!turfStandaardGezet){turfStandaardGezet=true;if(aanwezig.namen.length)filters.turven.g='__aanwezig';}
  var oud=el.querySelector('.turf-wrap'),st=oud?oud.scrollTop:0,sl=oud?oud.scrollLeft:0;

  if(!lijst.length){el.innerHTML=h+leegTekst();return;}
  h+='<div class="turf-wrap"><table class="turf"><thead><tr><th class="tnaam">Naam</th>'+p.map(function(x){
    return '<th>'+esc(x.categorie).replace(/\//g,'/<wbr>')+'<span class="prijs">'+euro(x.prijs)+'</span></th>';}).join('')+'</tr></thead><tbody>';
  h+=lijst.map(function(l){
    var s=saldo(l.naam),laatste=turfLaatste&&turfLaatste.naam===l.naam;
    return '<tr'+(laatste?' class="laatste"':'')+'><td class="tnaam"><b>'+(isAanwezig(l.naam)?'<span class="aanw-stip"></span>':'')+esc(l.naam)+'</b>'+
      '<small class="num '+(s<-0.004?'neg':'pos')+'">'+(s<grens-0.004?'⚠ ':'')+euro(s)+'</small></td>'+
      p.map(function(x,i){var n=tel[l.naam+'|'+x.categorie]||0;
        return '<td><button class="turf-vak'+(n>0?' heeft':'')+'" data-act="turf" data-naam="'+esc(l.naam)+'" data-i="'+i+'" aria-label="'+esc(x.categorie)+' voor '+esc(l.naam)+'">'+(n>0?n:'')+'</button></td>';}).join('')+'</tr>';
  }).join('')+'</tbody></table></div>';
  var nu=Date.now(),kan=turfLaatste&&!turfLaatste.teruggedraaid&&(nu-turfLaatste.tijd)<TURF_ONGEDAAN_MS;
  h+='<div class="turf-balk">'+(turfLaatste?
    (turfLaatste.teruggedraaid?'<span class="tekst stil">Teruggedraaid: 1x '+esc(turfLaatste.categorie)+' voor '+esc(turfLaatste.naam)+'</span>':
      '<span class="tekst">1x '+esc(turfLaatste.categorie)+' voor '+esc(turfLaatste.naam)+' opgeslagen</span>'+(kan?'<button class="knop" data-act="turf-ongedaan">Ongedaan maken</button>':'')):
    '<span class="tekst stil">Tik in een vakje om een streepje te zetten. Het getal is het aantal van vanavond.</span>')+'</div>';
  el.innerHTML=h;
  var nw=el.querySelector('.turf-wrap');if(nw){nw.scrollTop=st;nw.scrollLeft=sl;}
}
function turfTik(naam,i){
  var x=prijzen()[i];if(!x||!naam)return;
  var r=regel({naam:naam,type:'consumptie',categorie:x.categorie,aantal:1,stukprijs:x.prijs,bedrag:-x.prijs,bron:'turf'});
  turfLaatste={naam:naam,categorie:x.categorie,regel:r,tijd:Date.now(),teruggedraaid:false};
  if(!bewaarLokaal([r])){turfLaatste=null;renderTurven();return;}
  clearTimeout(turfTimer);turfTimer=setTimeout(function(){if(huidigTab==='turven')renderTurven();},TURF_ONGEDAAN_MS+50);
}
function turfOngedaan(){
  var t=turfLaatste;
  if(!t||t.teruggedraaid||(Date.now()-t.tijd)>=TURF_ONGEDAAN_MS){renderTurven();return;}
  var r=t.regel;
  var c=regel({naam:r.naam,type:'consumptie',categorie:r.categorie,aantal:-1,stukprijs:r.stukprijs,bedrag:r.stukprijs,refId:r.id,bron:'correctie',opmerking:'Turf ongedaan gemaakt'});
  if(bewaarLokaal([c])){t.teruggedraaid=true;renderTurven();}
}

// ---------- Historie + correcties ----------
var historieNaam='';
function historieItems(){
  var alle=alleRegels(),gecorrigeerd={},lokaalStatus={};
  lokaleRegels().forEach(function(r){lokaalStatus[r.id]=r.status;});
  alle.forEach(function(r){if(r.refId)gecorrigeerd[r.refId]=1;});
  var groep={};
  alle.forEach(function(r){
    if(r.type!=='consumptie'&&r.type!=='betaling')return;
    var k=(r.bestelId||r.id)+'|'+r.naam;
    if(!groep[k])groep[k]={sleutel:k,naam:r.naam,type:r.type,tijd:r.tijd,regels:[],bedrag:0,bron:r.bron,lijst:r.lijst};
    var g=groep[k];g.regels.push(r);g.bedrag+=Number(r.bedrag)||0;if(r.tijd<g.tijd)g.tijd=r.tijd;
    g.ingevoerd=Math.max(g.ingevoerd||0,r.aangemaakt||r.ontvangen||r.tijd||0);
  });
  return Object.keys(groep).map(function(k){
    var g=groep[k];g.bedrag=r2(g.bedrag);
    g.isCorrectie=g.regels.every(function(r){return !!r.refId;});
    g.teruggeboekt=!g.isCorrectie&&g.regels.every(function(r){return gecorrigeerd[r.id];});
    var st='ok';g.regels.forEach(function(r){var ls=lokaalStatus[r.id];if(!ls||ls==='verstuurd')return;if(ls==='geweigerd')st='fout';else if(ls==='wacht'&&st!=='fout')st='wacht';});
    g.status=st;
    g.omschrijving=g.type==='betaling'?(g.regels[0].opmerking||'Betaling'):g.regels.map(function(r){return r.aantal+'x '+r.categorie;}).join(', ');
    return g;
  }).sort(function(a,b){return b.tijd-a.tijd;});
}

  var items=historieItems().filter(function(g){return !historieNaam||g.naam===historieNaam;}).slice(0,150);
  historieCache=items;
  var nu=Date.now();
  h+='<div class="kaart" style="padding:4px 16px;">'+(items.length?items.map(function(g,i){
    var ico=g.status==='wacht'?'<span class="sync-ico wacht" title="Alleen op iPad">◷</span>':g.status==='fout'?'<span class="sync-ico fout" title="Geweigerd">!</span>':'<span class="sync-ico ok" title="In de Sheet">✓</span>';
    var magX=!g.isCorrectie&&!g.teruggeboekt&&(nu-(g.ingevoerd||g.tijd))<86400000;
    var labels=(g.isCorrectie?'<span class="label corr">correctie</span>':'')+(g.teruggeboekt?'<span class="label terug">teruggeboekt</span>':'')+(g.bron==='papier'?'<span class="label papier">papier'+(g.lijst?' '+esc(g.lijst):'')+'</span>':'');

  }).join(''):'<p class="sub" style="margin:12px 0;">Nog geen bestellingen.</p>')+'</div>';
  el.innerHTML=h;

// Toont alleen het begin en eind van de geheime script-URL
function urlKort(u){
  var m=String(u||'').match(/\/s\/([^\/]+)\/exec/);
  if(!m)return u?'Gekoppeld (adres verborgen)':'Niet gekoppeld';

// ---------- Pincode ----------
var pinInvoer='',pinDoel=null;
function vraagPin(titel,info,klaar){
  pinInvoer='';pinDoel=klaar;
  document.getElementById('pin-titel').textContent=titel;
  document.getElementById('pin-info').innerHTML=info||'';
  document.getElementById('pin-fout').textContent='';
  pinTonen();document.getElementById('pin').classList.remove('hidden');
}
var pinFout=0,pinBlokTot=0;
function pinLengte(){var p=cache&&cache.pin;return p&&p.lengte>=4&&p.lengte<=6?p.lengte:4;}
function pinTonen(){var n=pinLengte(),t='';for(var i=0;i<n;i++)t+=i<pinInvoer.length?'●':'·';document.getElementById('pin-punten').textContent=t;}
// Controleert een ingetikte pincode tegen de hash uit de Sheet. Werkt ook zonder wifi.
function pinKlopt(invoer){
  var p=cache&&cache.pin;
  if(p&&p.zout&&p.hash&&p.rondes)return hashPin(p.zout,invoer,p.rondes)===p.hash;
  return invoer===String(inst('Pincode','1234')).trim(); // alleen bij een script van voor versie 3.2
}
function pinTik(c){
  if(c==='stop'){document.getElementById('pin').classList.add('hidden');pinDoel=null;return;}
  if(c==='wis'){pinInvoer=pinInvoer.slice(0,-1);pinTonen();return;}
  var nu=Date.now();
  if(nu<pinBlokTot){document.getElementById('pin-fout').textContent='Te vaak fout. Wacht '+Math.ceil((pinBlokTot-nu)/1000)+' seconden.';return;}
  var n=pinLengte();
  if(pinInvoer.length>=n)return;
  pinInvoer+=c;pinTonen();
  if(pinInvoer.length===n)setTimeout(function(){
    if(pinKlopt(pinInvoer)){
      pinFout=0;document.getElementById('pin').classList.add('hidden');var f=pinDoel;pinDoel=null;if(f)f();
    }else{
      pinFout++;pinInvoer='';pinTonen();
      if(pinFout>=5){pinFout=0;pinBlokTot=Date.now()+30000;document.getElementById('pin-fout').textContent='Te vaak fout. Wacht 30 seconden.';}
      else document.getElementById('pin-fout').textContent='Onjuiste pincode';
    }
  },120);
}

    case 'groep':filters[el.dataset.ctx].g=el.dataset.groep;if(el.dataset.ctx==='papier')renderPapier();else renderAlles();break;
    case 'aanmelden':toggleAanwezig(el.dataset.naam);break;
    case 'afsluiten':avondAfsluiten();break;
    case 'kies-lid':
      var nieuweNaam=el.dataset.naam,bonVol=Object.keys(bestel.bon).some(function(k){return bestel.bon[k]>0;});
      if(bonVol&&bestel.naam&&nieuweNaam!==bestel.naam){toast('Sla eerst het bonnetje van '+bestel.naam+' op, of maak het leeg','rood');break;}
      if(nieuweNaam===bestel.naam&&!bonVol&&isBreed()){bestel={naam:null,bon:{}};renderBestellen();break;}
      bestel={naam:nieuweNaam,bon:bonVol?bestel.bon:{}};renderBestellen();if(!isBreed())window.scrollTo(0,0);break;
    case 'bon-leeg':bestel.bon={};renderBestellen();break;
    case 'bestel-terug':bestel={naam:null,bon:{}};renderAlles();break;
    case 'bon-plus':if(!bestel.naam){toast('Kies eerst wie er bestelt');break;}var c=prijzen()[Number(el.dataset.i)].categorie;bestel.bon[c]=(bestel.bon[c]||0)+1;renderBestellen();break;
    case 'bon-min':var c2=prijzen()[Number(el.dataset.i)].categorie;bestel.bon[c2]=(bestel.bon[c2]||0)-1;if(bestel.bon[c2]<=0)delete bestel.bon[c2];renderBestellen();break;
    case 'bon-opslaan':bonOpslaan();break;
    case 'ronde-cat':ronde.cat=prijzen()[Number(el.dataset.i)].categorie;renderRonde();break;
    case 'ronde-lid':var s=ronde.sel[ronde.cat]||(ronde.sel[ronde.cat]={});if(s[el.dataset.naam])delete s[el.dataset.naam];else s[el.dataset.naam]=1;renderRonde();break;
    case 'ronde-opslaan':rondeOpslaan();break;
    case 'turf':turfTik(el.dataset.naam,Number(el.dataset.i));break;
    case 'turf-ongedaan':turfOngedaan();break;
    case 'corrigeer':corrigeer(Number(el.dataset.i));break;
    case 'open-wachtrij':openOverlay(renderWachtrij);break;
    case 'nu-versturen':toast('Versturen...');synchroniseer(true).then(renderAlles);break;
    case 'ververs':toast('Gegevens ophalen...');haalGegevens().then(function(ok){toast(ok?'Gegevens bijgewerkt':'Ophalen lukt nu niet',ok?'groen':'rood');});break;
    case 'controle':toast('Controleren...');volledigeControle().then(function(r){
        if(!r.ok){toonMelding('Controle lukt nu niet','Geen antwoord van de Sheet ('+r.fout+'). Probeer het opnieuw met verbinding.');return;}
        if(r.terug){toonMelding('Controle: '+r.terug+' bestelling(en) ontbraken','Deze stonden op de iPad als verstuurd, maar niet volledig in de Sheet. Ze worden nu opnieuw verstuurd.');synchroniseer();}
        else toonMelding('Controle in orde','Alle '+r.gecontroleerd+' verstuurde bestellingen op deze iPad staan volledig in de Sheet.',true);
      });break;
    case 'exporteer':toonExport();break;
    case 'kopieer':var t=document.getElementById('export-tekst');t.focus();t.select();t.setSelectionRange(0,t.value.length);try{document.execCommand('copy');toast('Gekopieerd','groen');}catch(err){toast('Selecteer de tekst en kopieer handmatig','rood');}break;
    case 'deel':navigator.share({title:'Barlijst export',text:document.getElementById('export-tekst').value}).catch(function(){});break;
    case 'sluit':sluitOverlay();renderAlles();break;
    case 'vergrendel':beheerOpen=false;naarTab('aanmelden');break;
    case 'betaling':betalingOpslaan();break;
    case 'papier-open':openPapier();break;
    case 'papier-sluit':sluitOverlay();renderAlles();break;
    case 'papier-wis':if(confirm('Alle ingevulde aantallen van deze lijst wissen?')){papier=papierNieuw();lsWeg(K.papier);renderPapier();}break;
    case 'papier-check':papierControle();break;
    case 'papier-terug':overlayRender=renderPapier;renderPapier();break;
    case 'papier-opslaan':papierOpslaan();break;
    case 'print':afdrukken();break;
    case 'inkoop-open':openVoorraadForm('inkoop');break;
    case 'telling-open':openVoorraadForm('telling');break;
    case 'vr-opslaan':vrOpslaan(el.dataset.soort);break;
    case 'pin':pinTik(el.dataset.c);break;
    case 'url-wijzig':toonSetup();break;
    case 'setup-verbind':setupVerbind();break;
    case 'setup-sluit':document.getElementById('setup').classList.add('hidden');break;
  }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.zoek){filters[el.dataset.zoek].z=el.value;
    if(el.dataset.zoek==='papier'){var pos=el.selectionStart;renderPapier();var nieuw=document.querySelector('[data-zoek="papier"]');if(nieuw){nieuw.focus();try{nieuw.setSelectionRange(pos,pos);}catch(x){}}}
    else renderAlles();}
  else if(el.dataset.papierNaam!==undefined)papierInvoer(el);
  else if(el.dataset.papierVeld){papier[el.dataset.papierVeld]=el.value;papierBewaar();}
  else if(el.dataset.vr!==undefined)vrInvoer(el);
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset.actChange==='hist-naam'){historieNaam=el.value;renderHistorie();}
});

// ---------- Start ----------
function zetMaten(){
  var k=document.querySelector('.kop');
  document.documentElement.style.setProperty('--kop-h',(k?k.offsetHeight:104)+'px');
  document.documentElement.style.setProperty('--app-h',window.innerHeight+'px');
}
var _breedWas=null,_maatTimer=null;
window.addEventListener('resize',function(){
  clearTimeout(_maatTimer);
  _maatTimer=setTimeout(function(){zetMaten();var b=isBreed();if(b!==_breedWas){_breedWas=b;if(huidigTab==='bestellen')renderBestellen();}},120);
});
function start(){
  zetMaten();_breedWas=isBreed();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  renderAlles();
  if(!url){toonSetup();return;}
  haalGegevens().then(function(){synchroniseer();});
  setInterval(function(){if(wachtend().length)synchroniseer();},SYNC_INTERVAL_MS);
  setInterval(function(){if(!wachtend().length&&!bezigMetSync)haalGegevens();},VERVERS_INTERVAL_MS);
  setInterval(function(){
    var dag=isoDatum(baravondStart());if(aanwezig.dag!==dag){aanwezig={dag:dag,namen:[]};lsSet(K.aanwezig,aanwezig);}
    renderStatus();
  },60000);
  window.addEventListener('online',function(){synchroniseer();});
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible')return;
    if(wachtend().length)synchroniseer();else haalGegevens();
  });
}
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
start();
</script>
